<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QuickFix | Holographic Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            min-height: 100vh;
            overflow-y: auto;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .holo-card {
            max-width: 550px;
            width: 100%;
            background: rgba(10, 10, 20, 0.45);
            backdrop-filter: blur(25px);
            border-radius: 80px;
            position: relative;
            overflow: visible;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            animation: floatIn 1s ease-out;
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .holo-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                #ff0066, #00ffcc, #ffcc00, #ff0066, #00ffcc);
            background-size: 400%;
            border-radius: 82px;
            z-index: -1;
            animation: borderGlow 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-inner {
            background: rgba(8, 8, 18, 0.75);
            backdrop-filter: blur(30px);
            border-radius: 78px;
            padding: 50px 40px 60px;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .card-inner::-webkit-scrollbar {
            width: 4px;
        }
        .card-inner::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .card-inner::-webkit-scrollbar-thumb {
            background: #ff0066;
            border-radius: 10px;
        }

        .icons-3d-area {
            position: relative;
            height: 180px;
            margin-bottom: 40px;
        }

        .floating-icon {
            position: absolute;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            animation: float3d 4s ease-in-out infinite;
            transition: all 0.3s;
        }

        .floating-icon:nth-child(1) { top: 0; left: 5%; animation-delay: 0s; background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .floating-icon:nth-child(2) { top: 20%; right: 0%; animation-delay: 0.5s; background: linear-gradient(135deg, #0abde3, #0097e6); }
        .floating-icon:nth-child(3) { bottom: 0; left: 15%; animation-delay: 1s; background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .floating-icon:nth-child(4) { top: 40%; left: 35%; animation-delay: 0.3s; background: linear-gradient(135deg, #fdcb6e, #f39c12); width: 55px; height: 55px; font-size: 26px; }
        .floating-icon:nth-child(5) { bottom: 10%; right: 10%; animation-delay: 0.8s; background: linear-gradient(135deg, #00cec9, #00b894); }
        .floating-icon:nth-child(6) { top: 50%; left: -5%; animation-delay: 1.2s; background: linear-gradient(135deg, #fd79a8, #e84393); width: 50px; height: 50px; font-size: 24px; }

        @keyframes float3d {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .floating-icon:hover {
            transform: scale(1.2) translateY(-10px) !important;
            filter: brightness(1.2);
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        .main-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .mini-badge {
            display: inline-block;
            background: rgba(255,255,255,0.08);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .big-logo {
            font-size: 68px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffcc00, #ff0066, #00ffcc);
            background-size: 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 4s linear infinite;
            letter-spacing: -2px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subhead {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .input-3d {
            position: relative;
        }

        .input-3d i {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: rgba(255,255,255,0.4);
            z-index: 2;
            transition: all 0.3s;
        }

        .input-3d input {
            width: 100%;
            padding: 20px 25px 20px 58px;
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            font-size: 16px;
            font-weight: 500;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s;
        }

        .input-3d input:focus {
            outline: none;
            border-color: #ff0066;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(255,0,102,0.2);
        }

        .input-3d input:focus + i {
            color: #ff0066;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            gap: 15px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.15);
        }
        .divider-text {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .btn-3d {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, #ff0066, #ffcc00, #00ffcc, #ff0066);
            background-size: 300%;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            animation: btnShine 3s linear infinite;
        }

        @keyframes btnShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .btn-3d:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255,0,102,0.5);
        }

        .btn-3d:active {
            transform: scale(0.98);
        }

        .btn-3d:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            animation: none;
        }

        .btn-google {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.08);
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .btn-google:hover {
            background: rgba(255,255,255,0.15);
            border-color: #ff0066;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255,0,102,0.2);
        }

        .btn-google:active {
            transform: scale(0.98);
        }

        .btn-google i {
            font-size: 22px;
            color: white;
        }

        .btn-demo {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ffcc00, #ff8800);
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Space Grotesk', sans-serif;
            margin-top: 12px;
        }

        .btn-demo:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 200, 0, 0.4);
        }

        .btn-demo:active {
            transform: scale(0.98);
        }

        .btn-outline-3d {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
        }

        .btn-outline-3d:hover {
            border-color: #00ffcc;
            color: #00ffcc;
            background: rgba(0,255,204,0.1);
        }

        .otp-panel {
            display: none;
            animation: slideRight 0.5s ease;
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .timer-text {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            margin-top: 20px;
        }

        .resend-link {
            color: #00ffcc;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .toast-3d {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            padding: 14px 28px;
            border-radius: 50px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 3px solid #ff0066;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .toast-3d.show {
            transform: translateX(-50%) translateY(0);
        }

        .spinner-3d {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .env-warning {
            background: rgba(255, 200, 0, 0.15);
            border: 1px solid rgba(255, 200, 0, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 200, 0, 0.8);
            display: none;
        }
        .env-warning i {
            margin-right: 8px;
        }

        @media (max-width: 550px) {
            .card-inner {
                padding: 30px 20px 40px;
                max-height: 95vh;
            }
            .big-logo {
                font-size: 42px;
            }
            .floating-icon {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            .floating-icon:nth-child(4) { width: 40px; height: 40px; font-size: 18px; }
            .floating-icon:nth-child(6) { width: 38px; height: 38px; font-size: 16px; }
            .toast-3d {
                white-space: normal;
                text-align: center;
                max-width: 90%;
            }
            .icons-3d-area {
                height: 150px;
            }
            .main-title {
                margin-bottom: 30px;
            }
            .btn-3d {
                padding: 14px;
                font-size: 14px;
            }
            .btn-google, .btn-demo {
                padding: 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="container">
    <div class="holo-card">
        <div class="card-inner">
            <!-- 3D Floating Icons -->
            <div class="icons-3d-area">
                <div class="floating-icon"><i class="fas fa-wrench"></i></div>
                <div class="floating-icon"><i class="fas fa-bolt"></i></div>
                <div class="floating-icon"><i class="fas fa-tools"></i></div>
                <div class="floating-icon"><i class="fas fa-plug"></i></div>
                <div class="floating-icon"><i class="fas fa-paint-roller"></i></div>
                <div class="floating-icon"><i class="fas fa-car"></i></div>
            </div>

            <!-- Title -->
            <div class="main-title">
                <div class="mini-badge">
                    <i class="fas fa-crown"></i> PREMIUM SERVICE
                </div>
                <div class="big-logo">QuickFix</div>
                <div class="subhead">On-Demand Expert Karigar • 24/7 Support</div>
            </div>

            <!-- Environment Warning -->
            <div class="env-warning" id="envWarning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>⚠️ Running on file:// protocol. Use "Demo Login" or open with Live Server.</span>
            </div>

            <!-- Phone Panel -->
            <div id="phonePanel">
                <div class="form-group">
                    <div class="input-3d">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="tel" id="phoneNumber" placeholder="+91 | Mobile Number" maxlength="10" autocomplete="off">
                    </div>
                </div>
                <button class="btn-3d" id="sendOtpBtn">
                    <i class="fas fa-arrow-right"></i> Send OTP
                </button>

                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">OR</div>
                    <div class="divider-line"></div>
                </div>

                <!-- Google Sign-In Button -->
                <button class="btn-google" id="googleSignInBtn">
                    <i class="fab fa-google"></i> Continue with Google
                </button>

                <!-- Demo Login Button -->
                <button class="btn-demo" id="demoLoginBtn">
                    <i class="fas fa-rocket"></i> Demo Login (Skip)
                </button>
            </div>

            <!-- OTP Panel -->
            <div id="otpPanel" class="otp-panel">
                <div class="form-group">
                    <div class="input-3d">
                        <i class="fas fa-lock"></i>
                        <input type="text" id="otpNumber" placeholder="Enter 6-digit OTP" maxlength="6" autocomplete="off">
                    </div>
                </div>
                <button class="btn-3d" id="verifyOtpBtn">
                    <i class="fas fa-check-double"></i> Verify & Login
                </button>
                <button class="btn-outline-3d" id="backToPhone">
                    <i class="fas fa-chevron-left"></i> Back
                </button>
                <div class="timer-text" id="timerDisplay"></div>
            </div>
        </div>
    </div>
</div>

<div id="toastMessage" class="toast-3d"></div>

<script>
    // ==========================================
    // FIREBASE CONFIG
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCcxSH7r6Ct1MuZMt5jf1tGKXSMHYTSEHw",
        authDomain: "quickfix-907c0.firebaseapp.com",
        projectId: "quickfix-907c0",
        storageBucket: "quickfix-907c0.firebasestorage.app",
        messagingSenderId: "539102384460",
        appId: "1:539102384460:web:dd30f361033e16f8e63fe9",
        measurementId: "G-B548C8R9WV"
    };

    // Initialize Firebase
    let auth, db;
    
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        auth = firebase.auth();
        db = firebase.firestore();
        console.log("✅ Firebase initialized successfully");
    } catch (error) {
        console.error("Firebase init error:", error);
    }

    // Check if running on file:// protocol
    const isFileProtocol = window.location.protocol === 'file:';
    const envWarning = document.getElementById('envWarning');
    if (isFileProtocol) {
        envWarning.style.display = 'block';
    }

    // ==========================================
    // 3D CANVAS BACKGROUND
    // ==========================================
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    let time = 0;
    function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#0a0a1a');
        grad.addColorStop(0.5, '#1a0a2e');
        grad.addColorStop(1, '#0a0a1a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            const offset = time * 0.002 + i * Math.PI * 2 / 3;
            for (let x = 0; x < canvas.width; x += 10) {
                const y = canvas.height / 2 + 
                         Math.sin(x * 0.005 + offset) * 50 + 
                         Math.cos(x * 0.003 + offset * 1.3) * 30;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `hsla(${200 + i * 60}, 80%, 60%, 0.15)`;
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        for (let i = 0; i < 80; i++) {
            ctx.beginPath();
            const px = (Math.sin(time * 0.001 * i + i) * canvas.width * 0.4) + canvas.width * 0.5;
            const py = (Math.cos(time * 0.0008 * i + i * 2) * canvas.height * 0.3) + canvas.height * 0.5;
            ctx.arc(px, py, 2, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${200 + i % 360}, 70%, 60%, 0.3)`;
            ctx.fill();
        }
        
        time++;
        requestAnimationFrame(drawBackground);
    }
    drawBackground();

    // ==========================================
    // TOAST FUNCTION
    // ==========================================
    function showToast(msg, isError = false) {
        const toastEl = document.getElementById('toastMessage');
        toastEl.textContent = msg;
        toastEl.style.borderLeftColor = isError ? '#ff0066' : '#00ffcc';
        toastEl.classList.add('show');
        clearTimeout(toastEl._timeout);
        toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), 3500);
    }

    // ==========================================
    // SAVE USER TO FIRESTORE
    // ==========================================
    async function saveUserToFirestore(user) {
        try {
            const userRef = db.collection("users").doc(user.uid);
            const userSnap = await userRef.get();
            
            if (!userSnap.exists) {
                await userRef.set({
                    uid: user.uid,
                    email: user.email || null,
                    displayName: user.displayName || null,
                    phoneNumber: user.phoneNumber || null,
                    photoURL: user.photoURL || null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    userType: "customer",
                    isActive: true
                });
            } else {
                await userRef.update({
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            return true;
        } catch (error) {
            console.warn("Firestore save error:", error);
            return false;
        }
    }

    // ==========================================
    // REDIRECT AFTER LOGIN
    // ==========================================
    function redirectToHomepage(user) {
        localStorage.setItem('quickfix_auth', 'true');
        localStorage.setItem('quickfix_user_uid', user.uid);
        localStorage.setItem('quickfix_user_email', user.email || '');
        localStorage.setItem('quickfix_user_name', user.displayName || 'User');
        localStorage.setItem('quickfix_user_phone', user.phoneNumber || '');
        
        showToast('🎉 Login successful! Redirecting...');
        setTimeout(() => {
            window.location.href = 'user-homepage.html';
        }, 800);
    }

    // ==========================================
    // DEMO LOGIN
    // ==========================================
    function demoLogin() {
        const demoUser = {
            uid: "demo_user_" + Date.now(),
            email: "demo@quickfix.com",
            displayName: "Demo User",
            phoneNumber: "+919876543210",
            photoURL: null
        };
        
        localStorage.setItem('quickfix_auth', 'true');
        localStorage.setItem('quickfix_user_uid', demoUser.uid);
        localStorage.setItem('quickfix_user_email', demoUser.email);
        localStorage.setItem('quickfix_user_name', demoUser.displayName);
        localStorage.setItem('quickfix_user_phone', demoUser.phoneNumber);
        localStorage.setItem('quickfix_mode', 'demo');
        
        showToast('🎉 Demo Login successful! Redirecting...');
        setTimeout(() => {
            window.location.href = 'user-homepage.html';
        }, 800);
    }

    // ==========================================
    // GOOGLE SIGN-IN
    // ==========================================
    async function signInWithGoogle() {
        if (isFileProtocol) {
            showToast('❌ Google Sign-In not supported on file:// protocol. Use "Demo Login".', true);
            return;
        }

        const googleBtn = document.getElementById('googleSignInBtn');
        googleBtn.innerHTML = '<div class="spinner-3d"></div> Connecting...';
        googleBtn.disabled = true;
        
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            
            console.log("✅ Google Sign-In successful:", user);
            
            await saveUserToFirestore(user);
            redirectToHomepage(user);
            
        } catch (error) {
            console.error("Google Sign-In error:", error);
            let errorMsg = "Google Sign-In failed. ";
            if (error.code === 'auth/popup-closed-by-user') {
                errorMsg = "Sign-in popup was closed. Please try again.";
            } else if (error.code === 'auth/account-exists-with-different-credential') {
                errorMsg = "This account already exists with a different sign-in method.";
            } else if (error.code === 'auth/operation-not-supported-in-this-environment') {
                errorMsg = "Google Sign-In not supported on file:// protocol. Use 'Demo Login'.";
            } else {
                errorMsg += error.message || "Please try again.";
            }
            showToast(errorMsg, true);
            
            googleBtn.innerHTML = '<i class="fab fa-google"></i> Continue with Google';
            googleBtn.disabled = false;
        }
    }

    // ==========================================
    // OTP AUTHENTICATION
    // ==========================================
    let confirmationResult = null;
    let timerInterval = null;
    let timeLeft = 0;
    let recaptchaVerifier = null;
    
    const phonePanel = document.getElementById('phonePanel');
    const otpPanel = document.getElementById('otpPanel');
    const phoneInput = document.getElementById('phoneNumber');
    const otpInput = document.getElementById('otpNumber');
    const sendBtn = document.getElementById('sendOtpBtn');
    const verifyBtn = document.getElementById('verifyOtpBtn');
    const backBtn = document.getElementById('backToPhone');
    const timerDisplay = document.getElementById('timerDisplay');

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 60;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.innerHTML = `Didn't get code? <span class="resend-link" id="resendNow">Resend OTP</span>`;
                const resendSpan = document.getElementById('resendNow');
                if (resendSpan) {
                    resendSpan.onclick = () => {
                        if (phoneInput.value.trim().length === 10) {
                            sendOtp();
                        } else {
                            showToast('Enter valid 10-digit number first', true);
                        }
                    };
                }
            } else {
                timeLeft--;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.innerHTML = `Resend in ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    async function sendOtp() {
        if (isFileProtocol) {
            showToast('❌ OTP not supported on file:// protocol. Use "Demo Login".', true);
            return;
        }

        const phone = phoneInput.value.trim();
        if (!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) {
            showToast('Please enter valid 10-digit mobile number', true);
            return;
        }
        
        const fullPhoneNumber = "+91" + phone;
        sendBtn.innerHTML = '<div class="spinner-3d"></div> Sending OTP...';
        sendBtn.disabled = true;
        
        try {
            if (!recaptchaVerifier) {
                recaptchaVerifier = new firebase.auth.RecaptchaVerifier('sendOtpBtn', {
                    'size': 'invisible',
                    'callback': () => {}
                });
                await recaptchaVerifier.render();
            }
            
            confirmationResult = await auth.signInWithPhoneNumber(fullPhoneNumber, recaptchaVerifier);
            showToast(`✨ OTP sent to ${fullPhoneNumber}`, false);
            
            phonePanel.style.display = 'none';
            otpPanel.style.display = 'block';
            otpInput.value = '';
            otpInput.focus();
            startTimer();
            
        } catch (error) {
            console.error("Error sending OTP:", error);
            let errorMsg = "Failed to send OTP. ";
            if (error.code === 'auth/invalid-phone-number') errorMsg += "Invalid phone number format.";
            else if (error.code === 'auth/too-many-requests') errorMsg += "Too many requests. Please try later.";
            else if (error.code === 'auth/quota-exceeded') errorMsg += "SMS quota exceeded. Please try again later.";
            else if (error.code === 'auth/operation-not-supported-in-this-environment') {
                errorMsg = "OTP not supported on file:// protocol. Use 'Demo Login'.";
            } else {
                errorMsg += error.message || "Please check your network.";
            }
            showToast(errorMsg, true);
        } finally {
            sendBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Send OTP';
            sendBtn.disabled = false;
        }
    }

    async function verifyOtp() {
        const otp = otpInput.value.trim();
        if (!otp || otp.length !== 6) {
            showToast('Please enter 6-digit OTP', true);
            return;
        }
        
        verifyBtn.innerHTML = '<div class="spinner-3d"></div> Verifying...';
        verifyBtn.disabled = true;
        
        try {
            if (!confirmationResult) {
                showToast('Please request OTP first', true);
                backToPhone();
                verifyBtn.innerHTML = '<i class="fas fa-check-double"></i> Verify & Login';
                verifyBtn.disabled = false;
                return;
            }
            
            const result = await confirmationResult.confirm(otp);
            const user = result.user;
            
            showToast('🎉 Login successful! Redirecting...', false);
            await saveUserToFirestore(user);
            redirectToHomepage(user);
            
        } catch (error) {
            console.error("Error verifying OTP:", error);
            let errorMsg = "Verification failed. ";
            if (error.code === 'auth/invalid-verification-code') errorMsg += "Wrong OTP entered.";
            else if (error.code === 'auth/session-expired') errorMsg += "OTP expired. Request a new one.";
            else errorMsg += error.message || "Please try again.";
            showToast(errorMsg, true);
            
            verifyBtn.innerHTML = '<i class="fas fa-check-double"></i> Verify & Login';
            verifyBtn.disabled = false;
        }
    }

    function backToPhone() {
        if (timerInterval) clearInterval(timerInterval);
        phonePanel.style.display = 'block';
        otpPanel.style.display = 'none';
        phoneInput.value = '';
        confirmationResult = null;
    }

    // ==========================================
    // EVENT LISTENERS
    // ==========================================
    document.getElementById('googleSignInBtn').addEventListener('click', signInWithGoogle);
    document.getElementById('demoLoginBtn').addEventListener('click', demoLogin);
    document.getElementById('sendOtpBtn').addEventListener('click', sendOtp);
    document.getElementById('verifyOtpBtn').addEventListener('click', verifyOtp);
    document.getElementById('backToPhone').addEventListener('click', backToPhone);

    phoneInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendOtp();
    });
    otpInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') verifyOtp();
    });

    // ==========================================
    // CHECK AUTH STATE
    // ==========================================
    if (auth) {
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log("✅ User already logged in:", user.email || user.phoneNumber);
            }
        });
    }

    console.log('🔥 QuickFix Login - Google + OTP + Firebase Integrated!');
    console.log('✅ Google Sign-In, Phone OTP, Firestore configured');
    console.log('ℹ️ If on file:// protocol, use "Demo Login" button');
</script>
</body>
</html>
