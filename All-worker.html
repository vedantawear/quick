<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Workers · QuickFix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060c);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 18px 0 18px;
            padding-bottom: 20px;
        }

        /* ==========================================
           HEADER WITH BACK BUTTON - SAME AS HOME PAGE
           ========================================== */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #f5b042;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(245, 176, 66, 0.15);
        }
        .back-btn:active {
            transform: scale(0.94);
        }

        .header-title h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-title p {
            font-size: 0.7rem;
            color: #b0c4de;
            margin-top: 2px;
        }

        .notification-icon {
            position: relative;
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(8px);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .notification-icon i {
            font-size: 1.4rem;
            color: #f5b042;
        }
        .badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background: #ff3b30;
            color: white;
            font-size: 0.6rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0a0f1e;
        }

        /* ==========================================
           SEARCH BAR - SAME AS HOME PAGE
           ========================================== */
        .search-bar-full {
            background: rgba(12, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 18px;
        }
        .search-bar-full i {
            font-size: 1.2rem;
            color: #f5b042;
        }
        .search-bar-full input {
            background: transparent;
            border: none;
            flex: 1;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .search-bar-full input::placeholder {
            color: #9aaebf;
        }

        /* ==========================================
           FILTER CHIPS - SAME AS HOME PAGE
           ========================================== */
        .filter-chips {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 18px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar {
            display: none;
        }
        .chip {
            flex-shrink: 0;
            background: rgba(20, 28, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #b0c4de;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .chip.active {
            background: #f5b042;
            color: #0a0f1e;
            box-shadow: 0 4px 12px rgba(245, 176, 66, 0.3);
        }
        .chip:hover:not(.active) {
            background: rgba(245, 176, 66, 0.1);
        }

        /* ==========================================
           STATS BAR - SAME AS HOME PAGE STYLE
           ========================================== */
        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-box {
            flex: 1;
            background: rgba(18, 27, 40, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-box .number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f5b042;
        }
        .stat-box .label {
            font-size: 0.6rem;
            color: #b0c4de;
            margin-top: 2px;
        }

        /* ==========================================
           WORKERS LIST - SAME STYLE AS HOME PAGE
           ========================================== */
        .workers-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
        }

        .worker-item {
            background: rgba(18, 27, 40, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 14px;
            align-items: center;
            transition: 0.25s;
        }
        .worker-item:hover {
            border-color: rgba(245, 176, 66, 0.3);
            transform: translateX(4px);
        }
        .worker-item:active {
            transform: scale(0.98);
        }

        .worker-avatar-lg {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c3e4e, #1a2a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            font-size: 1.6rem;
            font-weight: 600;
            color: #f5b042;
        }
        .online-dot-lg {
            width: 14px;
            height: 14px;
            background: #22b573;
            border-radius: 50%;
            border: 2.5px solid #0a0f1e;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }
        .offline-dot-lg {
            width: 14px;
            height: 14px;
            background: #6a7a8a;
            border-radius: 50%;
            border: 2.5px solid #0a0f1e;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .worker-details {
            flex: 1;
            min-width: 0;
        }
        .worker-details .name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .worker-details .name-row h4 {
            font-size: 1rem;
            font-weight: 600;
        }
        .worker-details .name-row .verified {
            color: #1a73e8;
            font-size: 0.8rem;
        }
        .worker-details .profession {
            font-size: 0.75rem;
            color: #b0c4de;
            margin-top: 2px;
        }
        .worker-details .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #b0c4de;
            margin-top: 4px;
        }
        .worker-details .rating-row .stars {
            color: #f9b81b;
            letter-spacing: 1px;
        }
        .worker-details .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
            color: #8aa0b8;
            margin-top: 6px;
        }
        .worker-details .meta-row i {
            color: #f5b042;
            width: 14px;
        }

        .worker-right {
            text-align: right;
            flex-shrink: 0;
        }
        .worker-right .price-tag {
            font-weight: 700;
            font-size: 1rem;
            color: #f5b042;
        }
        .worker-right .price-tag small {
            font-size: 0.6rem;
            color: #8aa0b8;
            font-weight: 400;
        }
        .worker-right .badge-status {
            display: block;
            font-size: 0.6rem;
            padding: 3px 10px;
            border-radius: 40px;
            margin-top: 4px;
            background: #2e7d32;
            color: white;
        }
        .worker-right .badge-status.offline {
            background: #4a5a6a;
        }
        .worker-right .book-btn-sm {
            margin-top: 6px;
            background: #f5b042;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: 0.2s;
        }
        .worker-right .book-btn-sm:hover {
            transform: scale(1.05);
        }
        .worker-right .book-btn-sm:active {
            transform: scale(0.95);
        }

        /* ==========================================
           BOTTOM NAVIGATION - EXACTLY LIKE HOME PAGE
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(10, 15, 25, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 20px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.6;
            background: transparent;
            border: none;
            padding: 4px 16px;
            color: #b0c4de;
            flex: 1;
            justify-content: center;
        }
        .nav-item.active {
            opacity: 1;
            transform: translateY(-3px);
        }
        .nav-item i {
            font-size: 1.6rem;
            color: #f5b042;
            transition: 0.2s;
        }
        .nav-item span {
            font-size: 0.65rem;
            font-weight: 500;
            color: #b0c4de;
        }
        .nav-item.active span {
            color: #f5b042;
        }

        /* ==========================================
           TOAST & EMPTY STATE
           ========================================== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid #f5b042;
            z-index: 2000;
            transition: transform 0.3s ease;
            white-space: nowrap;
            font-size: 14px;
            color: white;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8aa0b8;
        }
        .empty-state i {
            font-size: 3rem;
            color: #4a5a6a;
            margin-bottom: 12px;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 480px) {
            .app-container {
                padding: 14px 14px 0 14px;
            }
            .bottom-nav {
                padding: 10px 10px 18px;
            }
            .nav-item i {
                font-size: 1.4rem;
            }
            .nav-item span {
                font-size: 0.6rem;
            }
            .nav-item {
                padding: 4px 8px;
            }
            .worker-item {
                padding: 14px;
                flex-wrap: wrap;
            }
            .worker-right {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid rgba(255,255,255,0.05);
            }
            .worker-right .book-btn-sm {
                margin-top: 0;
            }
            .worker-right .badge-status {
                margin-top: 0;
            }
        }

        @media (min-width: 600px) {
            .app-container {
                border-radius: 28px;
                margin-top: 20px;
                background: rgba(10, 15, 25, 0.4);
                box-shadow: 0 20px 60px rgba(0, 20, 50, 0.08);
            }
            body {
                padding: 20px 0 80px 0;
                background: #0a0f1e;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">

    <!-- ===== HEADER WITH BACK BUTTON ===== -->
    <div class="top-header">
        <div class="header-left">
            <button class="back-btn" id="backBtn">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-title">
                <h1>All Workers</h1>
                <p id="workerCount">Loading workers...</p>
            </div>
        </div>
        <div class="notification-icon" id="notifBtn">
            <i class="fas fa-bell"></i>
            <span class="badge">3</span>
        </div>
    </div>

    <!-- ===== STATS BAR ===== -->
    <div class="stats-bar">
        <div class="stat-box">
            <div class="number" id="totalWorkers">0</div>
            <div class="label">Total Workers</div>
        </div>
        <div class="stat-box">
            <div class="number" id="onlineWorkers">0</div>
            <div class="label">Online Now</div>
        </div>
        <div class="stat-box">
            <div class="number" id="avgRating">0.0</div>
            <div class="label">⭐ Avg Rating</div>
        </div>
    </div>

    <!-- ===== SEARCH ===== -->
    <div class="search-bar-full">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search workers by name or profession...">
    </div>

    <!-- ===== FILTER CHIPS ===== -->
    <div class="filter-chips" id="filterChips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="plumber">Plumber</button>
        <button class="chip" data-filter="electrician">Electrician</button>
        <button class="chip" data-filter="carpenter">Carpenter</button>
        <button class="chip" data-filter="painter">Painter</button>
        <button class="chip" data-filter="ac repair">AC Repair</button>
        <button class="chip" data-filter="online">🟢 Online</button>
        <button class="chip" data-filter="toprated">⭐ Top Rated</button>
    </div>

    <!-- ===== WORKERS LIST ===== -->
    <div class="workers-list" id="workersList"></div>

    <!-- ===== BOTTOM NAVIGATION - SAME AS HOME PAGE (3 BUTTONS) ===== -->
    <div class="bottom-nav">
        <button class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>
        <button class="nav-item active" data-page="nearby">
            <i class="fas fa-users"></i>
            <span>Nearby</span>
        </button>
        <button class="nav-item" data-page="booking">
            <i class="fas fa-calendar-alt"></i>
            <span>Booking</span>
        </button>
        <button class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </button>
    </div>

    <div class="toast" id="toastMsg"></div>
</div>

<script>
    (function() {
        "use strict";

        // ==========================================
        // SAMPLE WORKERS DATA (12 workers)
        // ==========================================
        const allWorkers = [
            { id: 1, name: "Rajesh Kumar", profession: "Plumber", rating: 4.8, reviews: 324, distance: "0.6 km", price: 399, experience: "8 years", online: true, verified: true, topRated: true },
            { id: 2, name: "Sneha Sharma", profession: "Plumber", rating: 4.7, reviews: 212, distance: "1.2 km", price: 349, experience: "5 years", online: true, verified: true, topRated: false },
            { id: 3, name: "Amit Sharma", profession: "Electrician", rating: 4.9, reviews: 456, distance: "1.8 km", price: 449, experience: "10 years", online: true, verified: true, topRated: true },
            { id: 4, name: "Priya Patel", profession: "Electrician", rating: 4.6, reviews: 189, distance: "2.0 km", price: 399, experience: "6 years", online: false, verified: false, topRated: false },
            { id: 5, name: "Vikram Singh", profession: "Carpenter", rating: 4.8, reviews: 267, distance: "0.9 km", price: 379, experience: "7 years", online: true, verified: true, topRated: true },
            { id: 6, name: "Arjun Mehta", profession: "Carpenter", rating: 4.4, reviews: 98, distance: "2.5 km", price: 329, experience: "4 years", online: false, verified: false, topRated: false },
            { id: 7, name: "Suresh Patel", profession: "Painter", rating: 4.7, reviews: 203, distance: "1.5 km", price: 349, experience: "5 years", online: true, verified: true, topRated: false },
            { id: 8, name: "Meera Iyer", profession: "Painter", rating: 4.9, reviews: 178, distance: "0.7 km", price: 399, experience: "8 years", online: true, verified: true, topRated: true },
            { id: 9, name: "Ravi Kumar", profession: "AC Repair", rating: 4.8, reviews: 234, distance: "1.1 km", price: 499, experience: "6 years", online: true, verified: true, topRated: true },
            { id: 10, name: "Deepak Gupta", profession: "AC Repair", rating: 4.5, reviews: 156, distance: "2.2 km", price: 449, experience: "4 years", online: false, verified: false, topRated: false },
            { id: 11, name: "Anjali Nair", profession: "Electrician", rating: 4.7, reviews: 312, distance: "0.8 km", price: 429, experience: "9 years", online: true, verified: true, topRated: false },
            { id: 12, name: "Karan Joshi", profession: "Plumber", rating: 4.6, reviews: 145, distance: "1.6 km", price: 369, experience: "3 years", online: true, verified: false, topRated: false }
        ];

        // ==========================================
        // DOM REFS
        // ==========================================
        const workersList = document.getElementById('workersList');
        const searchInput = document.getElementById('searchInput');
        const filterChips = document.getElementById('filterChips');
        const backBtn = document.getElementById('backBtn');
        const notifBtn = document.getElementById('notifBtn');
        const toastMsg = document.getElementById('toastMsg');
        const totalWorkersEl = document.getElementById('totalWorkers');
        const onlineWorkersEl = document.getElementById('onlineWorkers');
        const avgRatingEl = document.getElementById('avgRating');
        const workerCountEl = document.getElementById('workerCount');

        // ==========================================
        // STATE
        // ==========================================
        let currentFilter = 'all';
        let currentSearch = '';
        let filteredWorkers = [...allWorkers];

        // ==========================================
        // HELPERS
        // ==========================================
        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function generateStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5 ? 1 : 0;
            let html = '';
            for (let i = 0; i < full; i++) html += '<i class="fas fa-star"></i>';
            if (half) html += '<i class="fas fa-star-half-alt"></i>';
            const empty = 5 - full - half;
            for (let i = 0; i < empty; i++) html += '<i class="far fa-star"></i>';
            return html;
        }

        function showToast(message, isError = false) {
            toastMsg.textContent = message;
            toastMsg.style.borderColor = isError ? '#ff0066' : '#f5b042';
            toastMsg.classList.add('show');
            clearTimeout(toastMsg._timer);
            toastMsg._timer = setTimeout(() => toastMsg.classList.remove('show'), 3000);
        }

        // ==========================================
        // UPDATE STATS
        // ==========================================
        function updateStats(workers) {
            totalWorkersEl.textContent = workers.length;
            const online = workers.filter(w => w.online).length;
            onlineWorkersEl.textContent = online;
            const avg = workers.reduce((sum, w) => sum + w.rating, 0) / (workers.length || 1);
            avgRatingEl.textContent = avg.toFixed(1);
            workerCountEl.textContent = `${workers.length} workers available`;
        }

        // ==========================================
        // RENDER WORKERS
        // ==========================================
        function renderWorkers(workers) {
            if (workers.length === 0) {
                workersList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <p>No workers found</p>
                        <small style="color:#6a7a8a;">Try adjusting your search or filters</small>
                    </div>
                `;
                updateStats([]);
                return;
            }

            workersList.innerHTML = workers.map(w => `
                <div class="worker-item fade-in" data-id="${w.id}">
                    <div class="worker-avatar-lg">
                        ${getInitials(w.name)}
                        <span class="${w.online ? 'online-dot-lg' : 'offline-dot-lg'}"></span>
                    </div>
                    <div class="worker-details">
                        <div class="name-row">
                            <h4>${w.name}</h4>
                            ${w.verified ? '<span class="verified"><i class="fas fa-check-circle"></i></span>' : ''}
                            ${w.topRated ? '<span style="background:#fef1d6;color:#b06d0c;font-size:0.55rem;padding:2px 8px;border-radius:40px;font-weight:600;">⭐ Top</span>' : ''}
                        </div>
                        <div class="profession">${w.profession}</div>
                        <div class="rating-row">
                            <span class="stars">${generateStars(w.rating)}</span>
                            ${w.rating} (${w.reviews} reviews)
                        </div>
                        <div class="meta-row">
                            <span><i class="fas fa-map-marker-alt"></i> ${w.distance}</span>
                            <span><i class="fas fa-briefcase"></i> ${w.experience}</span>
                            <span style="color:${w.online ? '#22b573' : '#6a7a8a'};">
                                <i class="fas fa-circle"></i> ${w.online ? 'Online' : 'Offline'}
                            </span>
                        </div>
                    </div>
                    <div class="worker-right">
                        <div class="price-tag">₹${w.price} <small>/hr</small></div>
                        <span class="badge-status ${w.online ? '' : 'offline'}">
                            ${w.online ? '✅ Available' : '⏰ Off Duty'}
                        </span>
                        <button class="book-btn-sm" data-id="${w.id}" data-name="${w.name}">Book Now</button>
                    </div>
                </div>
            `).join('');

            // Book Now buttons
            document.querySelectorAll('.book-btn-sm').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const name = this.getAttribute('data-name');
                    showToast(`✅ Booked ${name}! We'll connect you shortly.`);
                });
            });

            // Click on worker card
            document.querySelectorAll('.worker-item').forEach(card => {
                card.addEventListener('click', function() {
                    const name = this.querySelector('h4')?.textContent || 'Worker';
                    showToast(`👤 Viewing profile of ${name}`);
                });
            });

            updateStats(workers);
        }

        // ==========================================
        // FILTER & SEARCH LOGIC
        // ==========================================
        function applyFilters() {
            let result = [...allWorkers];

            // Search filter
            if (currentSearch.trim()) {
                const q = currentSearch.trim().toLowerCase();
                result = result.filter(w =>
                    w.name.toLowerCase().includes(q) ||
                    w.profession.toLowerCase().includes(q)
                );
            }

            // Category filter
            if (currentFilter === 'online') {
                result = result.filter(w => w.online === true);
            } else if (currentFilter === 'toprated') {
                result = result.filter(w => w.topRated === true);
            } else if (currentFilter !== 'all') {
                result = result.filter(w =>
                    w.profession.toLowerCase() === currentFilter.toLowerCase()
                );
            }

            filteredWorkers = result;
            renderWorkers(result);
        }

        // ==========================================
        // NAVIGATION
        // ==========================================
        function navigateTo(page) {
            if (page === 'home') {
                window.location.href = 'user-homepage.html';
            } else if (page === 'booking') {
                window.location.href = 'user-booking.html';
            } else if (page === 'profile') {
                window.location.href = 'user-profile.html';
            } else if (page === 'nearby') {
                // Already here
            }
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================

        // Back button
        backBtn.addEventListener('click', function() {
            window.location.href = 'user-homepage.html';
        });

        // Notification
        notifBtn.addEventListener('click', function() {
            showToast('🔔 You have 3 new notifications');
        });

        // Search
        searchInput.addEventListener('input', function() {
            currentSearch = this.value;
            applyFilters();
        });

        // Filter chips
        filterChips.addEventListener('click', function(e) {
            const chip = e.target.closest('.chip');
            if (!chip) return;

            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentFilter = chip.getAttribute('data-filter');
            applyFilters();
        });

        // Bottom navigation - 3 buttons only
        document.querySelectorAll('.nav-item').forEach(nav => {
            nav.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                navigateTo(page);
            });
        });

        // ==========================================
        // INIT
        // ==========================================
        function init() {
            renderWorkers(allWorkers);
            console.log('✅ All Workers page loaded!');
        }

        init();
    })();
</script>
</body>
</html>
