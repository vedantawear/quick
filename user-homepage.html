<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Workers · QuickFix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060c);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 18px 0 18px;
            padding-bottom: 20px;
        }

        /* ==========================================
           BOTTOM NAVIGATION
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(10, 15, 25, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 20px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.6;
            background: transparent;
            border: none;
            padding: 4px 16px;
            color: #b0c4de;
            flex: 1;
            justify-content: center;
        }
        .nav-item.active {
            opacity: 1;
            transform: translateY(-3px);
        }
        .nav-item i {
            font-size: 1.6rem;
            color: #f5b042;
            transition: 0.2s;
        }
        .nav-item span {
            font-size: 0.65rem;
            font-weight: 500;
            color: #b0c4de;
        }
        .nav-item.active span {
            color: #f5b042;
        }

        /* HEADER WITH BACK BUTTON */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #f5b042;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(245, 176, 66, 0.15);
        }
        .back-btn:active {
            transform: scale(0.94);
        }

        .header-title h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-title p {
            font-size: 0.7rem;
            color: #b0c4de;
            margin-top: 2px;
        }

        .notification-icon {
            position: relative;
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(8px);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .notification-icon i {
            font-size: 1.4rem;
            color: #f5b042;
        }
        .badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background: #ff3b30;
            color: white;
            font-size: 0.6rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0a0f1e;
        }

        /* SEARCH */
        .search-bar-full {
            background: rgba(12, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 18px;
        }
        .search-bar-full i {
            font-size: 1.2rem;
            color: #f5b042;
        }
        .search-bar-full input {
            background: transparent;
            border: none;
            flex: 1;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .search-bar-full input::placeholder {
            color: #9aaebf;
        }

        /* FILTER CHIPS */
        .filter-chips {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 18px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar {
            display: none;
        }
        .chip {
            flex-shrink: 0;
            background: rgba(20, 28, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #b0c4de;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .chip.active {
            background: #f5b042;
            color: #0a0f1e;
            box-shadow: 0 4px 12px rgba(245, 176, 66, 0.3);
        }
        .chip:hover:not(.active) {
            background: rgba(245, 176, 66, 0.1);
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-box {
            flex: 1;
            background: rgba(18, 27, 40, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-box .number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f5b042;
        }
        .stat-box .label {
            font-size: 0.6rem;
            color: #b0c4de;
            margin-top: 2px;
        }

        /* WORKERS LIST */
        .workers-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
        }

        .worker-item {
            background: rgba(18, 27, 40, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 14px;
            align-items: center;
            transition: 0.25s;
            cursor: pointer;
        }
        .worker-item:hover {
            border-color: rgba(245, 176, 66, 0.3);
            transform: translateX(4px);
        }
        .worker-item:active {
            transform: scale(0.98);
        }

        .worker-avatar-lg {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c3e4e, #1a2a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            font-size: 1.6rem;
            font-weight: 600;
            color: #f5b042;
            overflow: hidden;
        }
        .worker-avatar-lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .online-dot-lg {
            width: 14px;
            height: 14px;
            background: #22b573;
            border-radius: 50%;
            border: 2.5px solid #0a0f1e;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }
        .offline-dot-lg {
            width: 14px;
            height: 14px;
            background: #6a7a8a;
            border-radius: 50%;
            border: 2.5px solid #0a0f1e;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .worker-details {
            flex: 1;
            min-width: 0;
        }
        .worker-details .name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .worker-details .name-row h4 {
            font-size: 1rem;
            font-weight: 600;
        }
        .worker-details .name-row .verified {
            color: #1a73e8;
            font-size: 0.8rem;
        }
        .worker-details .profession {
            font-size: 0.75rem;
            color: #b0c4de;
            margin-top: 2px;
        }
        .worker-details .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #b0c4de;
            margin-top: 4px;
        }
        .worker-details .rating-row .stars {
            color: #f9b81b;
            letter-spacing: 1px;
        }
        .worker-details .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
            color: #8aa0b8;
            margin-top: 6px;
        }
        .worker-details .meta-row i {
            color: #f5b042;
            width: 14px;
        }

        .worker-right {
            text-align: right;
            flex-shrink: 0;
        }
        .worker-right .price-tag {
            font-weight: 700;
            font-size: 1rem;
            color: #f5b042;
        }
        .worker-right .price-tag small {
            font-size: 0.6rem;
            color: #8aa0b8;
            font-weight: 400;
        }
        .worker-right .badge-status {
            display: block;
            font-size: 0.6rem;
            padding: 3px 10px;
            border-radius: 40px;
            margin-top: 4px;
            background: #2e7d32;
            color: white;
        }
        .worker-right .badge-status.offline {
            background: #4a5a6a;
        }
        .worker-right .book-btn-sm {
            margin-top: 6px;
            background: #f5b042;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: 0.2s;
        }
        .worker-right .book-btn-sm:hover {
            transform: scale(1.05);
        }
        .worker-right .book-btn-sm:active {
            transform: scale(0.95);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8aa0b8;
        }
        .empty-state i {
            font-size: 3rem;
            color: #4a5a6a;
            margin-bottom: 12px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid #f5b042;
            z-index: 2000;
            transition: transform 0.3s ease;
            white-space: nowrap;
            font-size: 14px;
            color: white;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #f5b042;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 14px 14px 0 14px;
            }
            .bottom-nav {
                padding: 10px 10px 18px;
            }
            .nav-item i {
                font-size: 1.4rem;
            }
            .nav-item span {
                font-size: 0.6rem;
            }
            .nav-item {
                padding: 4px 8px;
            }
            .worker-item {
                padding: 14px;
                flex-wrap: wrap;
            }
            .worker-right {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid rgba(255,255,255,0.05);
            }
            .worker-right .book-btn-sm {
                margin-top: 0;
            }
            .worker-right .badge-status {
                margin-top: 0;
            }
        }

        @media (min-width: 600px) {
            .app-container {
                border-radius: 28px;
                margin-top: 20px;
                background: rgba(10, 15, 25, 0.4);
                box-shadow: 0 20px 60px rgba(0, 20, 50, 0.08);
            }
            body {
                padding: 20px 0 80px 0;
                background: #0a0f1e;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    function showToast(message, isError = false) {
        toastMsg.textContent = message;
        toastMsg.style.borderColor = isError ? '#ff0066' : '#f5b042';
        toastMsg.classList.add('show');
        clearTimeout(toastMsg._timer);
        toastMsg._timer = setTimeout(() => toastMsg.classList.remove('show'), 3000);
    }

    // ==========================================
    // GET INITIALS
    // ==========================================
    function getInitials(name) {
        if (!name) return '?';
        return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    // ==========================================
    // GENERATE STARS
    // ==========================================
    function generateStars(rating) {
        const full = Math.floor(rating);
        const half = rating % 1 >= 0.5 ? 1 : 0;
        let html = '';
        for (let i = 0; i < full; i++) html += '<i class="fas fa-star"></i>';
        if (half) html += '<i class="fas fa-star-half-alt"></i>';
        const empty = 5 - full - half;
        for (let i = 0; i < empty; i++) html += '<i class="far fa-star"></i>';
        return html;
    }

    // ==========================================
    // LOAD WORKERS FROM FIRESTORE - REAL TIME
    // ==========================================
    function loadWorkersFromFirestore() {
        // Get all providers from Firestore
        db.collection("providers").where("userType", "==", "provider").onSnapshot((snapshot) => {
            allWorkers = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                allWorkers.push({
                    id: doc.id,
                    name: data.displayName || data.fullName || 'Provider',
                    profession: data.categoryName || data.category || 'General',
                    rating: data.rating || data.averageRating || 4.5,
                    reviews: data.totalReviews || Math.floor(Math.random() * 300) + 50,
                    distance: (Math.random() * 3 + 0.5).toFixed(1) + ' km',
                    price: data.price || Math.floor(Math.random() * 200) + 200,
                    experience: data.experience || Math.floor(Math.random() * 10) + 2 + ' years',
                    online: data.isOnline !== undefined ? data.isOnline : Math.random() > 0.3,
                    verified: data.verificationStatus === 'verified' || data.isVerified || Math.random() > 0.4,
                    topRated: data.rating > 4.7 || Math.random() > 0.7,
                    availableNow: data.isOnline || Math.random() > 0.5,
                    fastResponse: Math.random() > 0.6,
                    profilePhotoUrl: data.profilePhotoUrl || data.photoURL || '',
                    bio: data.bio || '',
                    skills: data.skills || []
                });
            });

            // If no providers found, use sample data
            if (allWorkers.length === 0) {
                allWorkers = getSampleWorkers();
            }

            updateStats(allWorkers);
            applyFilters();
            console.log('✅ Loaded ' + allWorkers.length + ' workers from Firestore');
        }, (error) => {
            console.error('Error loading workers:', error);
            // Fallback to sample data
            allWorkers = getSampleWorkers();
            updateStats(allWorkers);
            applyFilters();
            showToast('⚠️ Using sample data (Firestore error)', true);
        });
    }

            { id: 7, name: "Suresh Patel", profession: "Painter", rating: 4.7, reviews: 203, distance: "1.5 km", price: 349, experience: "5 years", online: true, verified: true, topRated: false, availableNow: true, fastResponse: false, profilePhotoUrl: "", bio: "" },
            { id: 8, name: "Meera Iyer", profession: "Painter", rating: 4.9, reviews: 178, distance: "0.7 km", price: 399, experience: "8 years", online: true, verified: true, topRated: true, availableNow: true, fastResponse: true, profilePhotoUrl: "", bio: "" },
            { id: 9, name: "Ravi Kumar", profession: "AC Repair", rating: 4.8, reviews: 234, distance: "1.1 km", price: 499, experience: "6 years", online: true, verified: true, topRated: true, availableNow: true, fastResponse: true, profilePhotoUrl: "", bio: "" },
            { id: 10, name: "Deepak Gupta", profession: "AC Repair", rating: 4.5, reviews: 156, distance: "2.2 km", price: 449, experience: "4 years", online: false, verified: false, topRated: false, availableNow: false, fastResponse: false, profilePhotoUrl: "", bio: "" }
        ];
    }

    // ==========================================
    // UPDATE STATS
    // ==========================================
    function updateStats(workers) {
        totalWorkersEl.textContent = workers.length;
        const online = workers.filter(w => w.online).length;
        onlineWorkersEl.textContent = online;
        const avg = workers.reduce((sum, w) => sum + w.rating, 0) / (workers.length || 1);
        avgRatingEl.textContent = avg.toFixed(1);
        workerCountEl.textContent = `${workers.length} workers available`;
    }

    // ==========================================
    // RENDER WORKERS
    // ==========================================
    function renderWorkers(workers) {
        if (workers.length === 0) {
            workersList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-user-slash"></i>
                    <p>No workers found</p>
                    <small style="color:#6a7a8a;">Try adjusting your search or filters</small>
                </div>
            `;
            return;
        }

        workersList.innerHTML = workers.map(w => {
            const badges = [];
            if (w.topRated) badges.push('<span class="badge top"><i class="fas fa-crown"></i> Top Rated</span>');
            if (w.availableNow) badges.push('<span class="badge available"><i class="fas fa-circle"></i> Available Now</span>');
            if (w.fastResponse) badges.push('<span class="badge fast"><i class="fas fa-bolt"></i> Fast Response</span>');

            const starsHtml = generateStars(w.rating);
            const hasPhoto = w.profilePhotoUrl && w.profilePhotoUrl.length > 10;

            return `
                <div class="worker-item fade-in" data-id="${w.id}">
                    <div class="worker-avatar-lg">
                        ${hasPhoto ? `<img src="${w.profilePhotoUrl}" alt="${w.name}">` : getInitials(w.name)}
                        <span class="${w.online ? 'online-dot-lg' : 'offline-dot-lg'}"></span>
                    </div>
                    <div class="worker-details">
                        <div class="name-row">
                            <h4>${w.name}</h4>
                            ${w.verified ? '<span class="verified"><i class="fas fa-check-circle"></i></span>' : ''}
                            ${w.topRated ? '<span style="background:#fef1d6;color:#b06d0c;font-size:0.55rem;padding:2px 8px;border-radius:40px;font-weight:600;">⭐ Top</span>' : ''}
                        </div>
                        <div class="profession">${w.profession}</div>
                        <div class="rating-row">
                            <span class="stars">${starsHtml}</span>
                            ${w.rating} (${w.reviews} reviews)
                        </div>
                        <div class="meta-row">
                            <span><i class="fas fa-map-marker-alt"></i> ${w.distance}</span>
                            <span><i class="fas fa-briefcase"></i> ${w.experience}</span>
                            <span style="color:${w.online ? '#22b573' : '#6a7a8a'};">
                                <i class="fas fa-circle"></i> ${w.online ? 'Online' : 'Offline'}
                            </span>
                        </div>
                        ${w.bio ? `<div style="font-size:0.65rem;color:#8aa0b8;margin-top:4px;">${w.bio}</div>` : ''}
                    </div>
                    <div class="worker-right">
                        <div class="price-tag">₹${w.price} <small>/hr</small></div>
                        <span class="badge-status ${w.online ? '' : 'offline'}">
                            ${w.online ? '✅ Available' : '⏰ Off Duty'}
                        </span>
                        <button class="book-btn-sm" data-id="${w.id}" data-name="${w.name}">Book Now</button>
                    </div>
                </div>
            `;
        }).join('');

        // Book Now buttons
        document.querySelectorAll('.book-btn-sm').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = this.getAttribute('data-name');
                showToast(`✅ Booked ${name}! We'll connect you shortly.`);
            });
        });

        // Click on worker card
        document.querySelectorAll('.worker-item').forEach(card => {
            card.addEventListener('click', function() {
                const name = this.querySelector('h4')?.textContent || 'Worker';
                showToast(`👤 Viewing profile of ${name}`);
            });
        });
    }

    // ==========================================
    // APPLY FILTERS & SEARCH
    // ==========================================
    function applyFilters() {
        let result = [...allWorkers];

        // Search filter
        if (currentSearch.trim()) {
            const q = currentSearch.trim().toLowerCase();
            result = result.filter(w =>
                w.name.toLowerCase().includes(q) ||
                w.profession.toLowerCase().includes(q)
            );
        }

        // Category filter
        if (currentFilter === 'online') {
            result = result.filter(w => w.online === true);
        } else if (currentFilter === 'toprated') {
            result = result.filter(w => w.topRated === true);
        } else if (currentFilter !== 'all') {
            result = result.filter(w =>
                w.profession.toLowerCase() === currentFilter.toLowerCase() ||
                w.profession.toLowerCase().replace('-', ' ') === currentFilter.toLowerCase()
            );
        }

        filteredWorkers = result;
        renderWorkers(result);
    }

    // ==========================================
    // NAVIGATION
    // ==========================================
    function navigateTo(page) {
        if (page === 'home') {
            window.location.href = 'user-homepage.html';
        } else if (page === 'booking') {
            window.location.href = 'user-booking.html';
        } else if (page === 'profile') {
            window.location.href = 'user-profile.html';
        } else if (page === 'nearby') {
            // Already here
        }
    }

    // ==========================================
    // EVENT LISTENERS
    // ==========================================

    // Back button
    backBtn.addEventListener('click', function() {
        window.location.href = 'user-homepage.html';
    });

    // Notification
    notifBtn.addEventListener('click', function() {
        showToast('🔔 You have 3 new notifications');
    });

    // Search
    searchInput.addEventListener('input', function() {
        currentSearch = this.value;
        applyFilters();
    });

    // Filter chips
    filterChips.addEventListener('click', function(e) {
        const chip = e.target.closest('.chip');
        if (!chip) return;

        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.getAttribute('data-filter');
        applyFilters();
    });

    // Bottom navigation
    document.querySelectorAll('.nav-item').forEach(nav => {
        nav.addEventListener('click', function(e) {
            e.preventDefault();
            const page = this.getAttribute('data-page');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            this.classList.add('active');
            navigateTo(page);
        });
    });

    // ==========================================
    // INIT
    // ==========================================
    function init() {
        // Check if user is logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('✅ User logged in:', user.email);
            } else {
                console.log('ℹ️ No user logged in');
            }
            // Load workers regardless of login status
            loadWorkersFromFirestore();
        });
    }

    init();

    console.log('%c👷 All Workers - Fully Real-time!', 'color: #f5b042; font-size: 14px; font-weight: bold;');
    console.log('✅ Firebase Auth, Firestore configured');
    console.log('✅ Real-time workers from Firestore');
    console.log('✅ Profile photos, ratings, categories - all real data');
</script>
</body>
