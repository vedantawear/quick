<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QuickFix - Login | Premium Service Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #0a0a1a 0%, #050508 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .bg-particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255, 204, 0, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 15s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .login-card {
            background: rgba(15, 25, 45, 0.65);
            backdrop-filter: blur(25px);
            border-radius: 56px;
            padding: 42px 32px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 204, 0, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 204, 0, 0.1);
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 204, 0, 0.4);
            box-shadow: 0 30px 55px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 204, 0, 0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff0066, #ffcc00, #00ffcc);
            background-size: 200%;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 10px 30px rgba(255, 0, 102, 0.3);
            animation: gradientPulse 3s ease infinite;
        }

        @keyframes gradientPulse {
            0% { background-position: 0% 50%; box-shadow: 0 10px 30px rgba(255, 0, 102, 0.3); }
            50% { background-position: 100% 50%; box-shadow: 0 10px 40px rgba(0, 255, 204, 0.4); }
            100% { background-position: 0% 50%; box-shadow: 0 10px 30px rgba(255, 0, 102, 0.3); }
        }

        .logo-icon i {
            font-size: 38px;
            color: white;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffcc00, #ff0066);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            margin-left: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 204, 0, 0.6);
            font-size: 16px;
            z-index: 2;
        }

        .input-group input {
            width: 100%;
            padding: 15px 18px 15px 48px;
            background: rgba(20, 35, 60, 0.8);
            border: 1.5px solid rgba(255, 204, 0, 0.15);
            border-radius: 44px;
            color: white;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ffcc00;
            background: rgba(30, 45, 75, 0.9);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(95deg, #ff0066, #ffcc00, #ff0066);
            background-size: 200%;
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 102, 0.4);
            background-position: 100%;
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            background-position: 0%;
        }

        .guest-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 14px;
            transition: all 0.25s ease;
        }

        .guest-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 204, 0, 0.5);
            color: #ffcc00;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0 10px;
        }

        .divider-line {
            flex: 1;
            height: 0.5px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            padding: 14px 24px;
            border-radius: 60px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            transform: translateY(120px);
            transition: transform 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            border-left: 4px solid #ffcc00;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Phone input styling */
        .input-group input[type="tel"] {
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 48px;
            }
            .logo-icon {
                width: 65px;
                height: 65px;
            }
            .logo-icon i {
                font-size: 30px;
            }
            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-tools"></i>
            </div>
            <h1>QuickFix</h1>
            <p>Expert services • On-demand • Trusted professionals</p>
        </div>

        <div class="input-group">
            <label><i class="fas fa-user" style="margin-right: 6px; font-size: 11px;"></i> Full Name</label>
            <div class="input-wrapper">
                <i class="fas fa-user-circle"></i>
                <input type="text" id="userName" placeholder="Enter your full name" autocomplete="name">
            </div>
        </div>
        
        <div class="input-group">
            <label><i class="fas fa-mobile-alt" style="margin-right: 6px; font-size: 11px;"></i> Phone Number (Optional)</label>
            <div class="input-wrapper">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" id="userPhone" placeholder="10-digit mobile number" maxlength="10" autocomplete="tel">
            </div>
            <div style="font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 6px; margin-left: 12px;">
                <i class="fas fa-info-circle"></i> Phone helps us connect you with service pros
            </div>
        </div>

        <button class="btn-login" id="loginBtn">
            <i class="fas fa-arrow-right"></i> Get Started
        </button>
        
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">or</div>
            <div class="divider-line"></div>
        </div>
        
        <button class="guest-btn" id="guestBtn">
            <i class="fas fa-globe"></i> Continue as Guest
        </button>
        
        <div style="text-align: center; margin-top: 24px; font-size: 10px; color: rgba(255,255,255,0.25);">
            By continuing, you agree to our Terms & Privacy Policy
        </div>
    </div>

    <div class="toast" id="toastMsg"></div>

    <!-- ==========================================
         FIREBASE SDK + INIT
         ========================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCcxSH7r6Ct1MuZMt5jf1tGKXSMHYTSEHw",
            authDomain: "quickfix-907c0.firebaseapp.com",
            projectId: "quickfix-907c0",
            storageBucket: "quickfix-907c0.firebasestorage.app",
            messagingSenderId: "539102384460",
            appId: "1:539102384460:web:dd30f361033e16f8e63fe9",
            measurementId: "G-B548C8R9WV"
        };

        // Initialize Firebase
        let auth, db;
        
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
            console.log("✅ Firebase initialized successfully");
        } catch (error) {
            console.error("Firebase init error:", error);
        }

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const toastMsg = document.getElementById('toastMsg');
        const loginBtn = document.getElementById('loginBtn');
        const guestBtn = document.getElementById('guestBtn');
        const userNameInput = document.getElementById('userName');
        const userPhoneInput = document.getElementById('userPhone');

        // ==========================================
        // TOAST FUNCTION
        // ==========================================
        function showToast(message, isError = false) {
            toastMsg.textContent = message;
            toastMsg.style.borderLeftColor = isError ? '#ff0066' : '#00ffcc';
            toastMsg.classList.add('show');
            clearTimeout(toastMsg._timeout);
            toastMsg._timeout = setTimeout(() => toastMsg.classList.remove('show'), 3500);
        }

        // ==========================================
        // SET LOADING STATE
        // ==========================================
        function setLoading(button, isLoading, originalContent = null) {
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<span class="loading-text"><span class="spinner"></span> Processing...</span>';
            } else {
                button.disabled = false;
                if (originalContent) {
                    button.innerHTML = originalContent;
                } else {
                    button.innerHTML = '<i class="fas fa-arrow-right"></i> Get Started';
                }
            }
        }

        // ==========================================
        // SAVE USER TO FIRESTORE
        // ==========================================
        async function saveUserToFirestore(user, name, phone) {
            try {
                const userRef = db.collection("users").doc(user.uid);
                const userSnap = await userRef.get();
                
                const now = firebase.firestore.FieldValue.serverTimestamp();
                const userData = {
                    uid: user.uid,
                    displayName: name,
                    phoneNumber: phone || '',
                    email: user.email || null,
                    userType: "customer",
                    isActive: true,
                    lastLogin: now,
                    updatedAt: now
                };
                
                if (!userSnap.exists) {
                    userData.createdAt = now;
                    userData.totalBookings = 0;
                    userData.walletBalance = 0;
                    userData.firstLogin = true;
                    userData.preferences = {
                        notifications: true,
                        language: "en"
                    };
                } else {
                    userData.firstLogin = false;
                    const existing = userSnap.data();
                    userData.walletBalance = existing.walletBalance || 0;
                    userData.totalBookings = existing.totalBookings || 0;
                }
                
                await userRef.set(userData, { merge: true });
                
                // Store in localStorage for quick access
                localStorage.setItem('quickfix_user_uid', user.uid);
                localStorage.setItem('quickfix_user_name', name);
                localStorage.setItem('quickfix_user_phone', phone || '');
                localStorage.setItem('quickfix_user_email', user.email || '');
                localStorage.setItem('quickfix_user_type', 'customer');
                
                return true;
            } catch (error) {
                console.error("Firestore save error:", error);
                return false;
            }
        }

        // ==========================================
        // CREATE OR AUTHENTICATE USER
        // ==========================================
        async function createOrAuthenticateUser(name, phone) {
            const cleanName = name.replace(/\s/g, '').toLowerCase();
            const timestamp = Date.now();
            const userEmail = phone && phone.length === 10 
                ? `${phone}@quickfix.user` 
                : `guest_${cleanName}_${timestamp}@quickfix.user`;
            const password = phone && phone.length === 10 ? `Quick${phone}Fix!` : `Guest${timestamp}Quick`;
            
            let userCredential;
            let isNewUser = false;
            
            try {
                // Try to sign in first
                userCredential = await auth.signInWithEmailAndPassword(userEmail, password);
                console.log("Existing user signed in");
            } catch (signInError) {
                if (signInError.code === 'auth/user-not-found' || signInError.code === 'auth/invalid-credential') {
                    // Create new user
                    try {
                        userCredential = await auth.createUserWithEmailAndPassword(userEmail, password);
                        isNewUser = true;
                        console.log("New user created");
                    } catch (createError) {
                        console.error("Create user error:", createError);
                        throw new Error(createError.message);
                    }
                } else {
                    throw signInError;
                }
            }
            
            const user = userCredential.user;
            
            // Update profile display name
            if (isNewUser || user.displayName !== name) {
                await user.updateProfile({ displayName: name });
            }
            
            // Save to Firestore
            await saveUserToFirestore(user, name, phone);
            
            // Store session info
            localStorage.setItem('quickfix_logged_in', 'true');
            localStorage.setItem('quickfix_auth_method', 'firebase');
            localStorage.setItem('quickfix_mode', 'user');
            localStorage.setItem('quickfix_session_start', Date.now().toString());
            
            const profile = {
                name: name,
                phone: phone || '',
                email: user.email,
                uid: user.uid,
                isNewUser: isNewUser,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('quickfix_profile', JSON.stringify(profile));
            
            return { success: true, isNewUser, user };
        }

        // ==========================================
        // GUEST LOGIN
        // ==========================================
        async function guestLogin() {
            try {
                const guestId = "guest_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
                const guestName = "Explorer";
                const guestPhone = "";
                
                localStorage.clear();
                
                localStorage.setItem('quickfix_logged_in', 'true');
                localStorage.setItem('quickfix_mode', 'guest');
                localStorage.setItem('quickfix_user_name', guestName);
                localStorage.setItem('quickfix_user_phone', guestPhone);
                localStorage.setItem('quickfix_guest_id', guestId);
                localStorage.setItem('quickfix_user_type', 'guest');
                
                const profile = {
                    name: guestName,
                    phone: guestPhone,
                    isGuest: true,
                    guestId: guestId,
                    createdAt: new Date().toISOString()
                };
                localStorage.setItem('quickfix_profile', JSON.stringify(profile));
                
                showToast('✨ Exploring as Guest — you can book services!');
                
                setTimeout(() => {
                    window.location.href = 'user-homepage.html';
                }, 800);
            } catch (err) {
                console.error("Guest login error:", err);
                showToast("Guest mode error, please try again", true);
            }
        }

        // ==========================================
        // MAIN LOGIN HANDLER
        // ==========================================
        async function handleLogin() {
            const name = userNameInput.value.trim();
            let phone = userPhoneInput.value.trim();
            
            if (!name) {
                showToast('👉 Please enter your name to continue', true);
                userNameInput.focus();
                return;
            }
            
            if (name.length < 2) {
                showToast('Please enter a valid name (at least 2 characters)', true);
                return;
            }
            
            if (phone && !/^\d{10}$/.test(phone)) {
                showToast('📱 Phone number must be exactly 10 digits', true);
                userPhoneInput.focus();
                return;
            }
            
            const originalBtnContent = loginBtn.innerHTML;
            setLoading(loginBtn, true);
            
            try {
                if (!auth || !db) {
                    throw new Error("Firebase not initialized. Using fallback mode.");
                }
                
                const result = await createOrAuthenticateUser(name, phone);
                
                if (result.success) {
                    const welcomeMsg = result.isNewUser 
                        ? `🎉 Welcome ${name}! Your QuickFix journey begins now.` 
                        : `👋 Welcome back ${name}! Ready to fix things?`;
                    showToast(welcomeMsg);
                    
                    setTimeout(() => {
                        window.location.href = 'user-homepage.html';
                    }, 1000);
                } else {
                    throw new Error("Authentication failed");
                }
            } catch (error) {
                console.error("Login error details:", error);
                let errorMessage = "Unable to sign in. ";
                
                if (error.message.includes('network')) {
                    errorMessage = "Network issue. Check your connection and try again.";
                } else if (error.message.includes('configuration')) {
                    errorMessage = "Service configuration issue. Using demo mode - redirecting...";
                    localStorage.setItem('quickfix_logged_in', 'true');
                    localStorage.setItem('quickfix_mode', 'demo');
                    localStorage.setItem('quickfix_user_name', name);
                    localStorage.setItem('quickfix_user_phone', phone || '');
                    localStorage.setItem('quickfix_demo_mode', 'true');
                    showToast(`✨ Welcome ${name}! (Demo Mode Active)`);
                    setTimeout(() => {
                        window.location.href = 'user-homepage.html';
                    }, 800);
                    return;
                } else {
                    errorMessage += error.message;
                }
                
                showToast(errorMessage, true);
                setLoading(loginBtn, false, originalBtnContent);
            }
        }

        // ==========================================
        // CHECK EXISTING SESSION
        // ==========================================
        async function checkExistingSession() {
            const isLoggedIn = localStorage.getItem('quickfix_logged_in') === 'true';
            const userUid = localStorage.getItem('quickfix_user_uid');
            
            if (isLoggedIn && userUid) {
                console.log("Existing session found, redirecting to homepage");
                window.location.href = 'user-homepage.html';
                return;
            }
            
            if (auth) {
                auth.onAuthStateChanged(async (user) => {
                    if (user && localStorage.getItem('quickfix_logged_in') !== 'true') {
                        try {
                            const userRef = db.collection("users").doc(user.uid);
                            const userSnap = await userRef.get();
                            if (userSnap.exists) {
                                const userData = userSnap.data();
                                localStorage.setItem('quickfix_logged_in', 'true');
                                localStorage.setItem('quickfix_user_uid', user.uid);
                                localStorage.setItem('quickfix_user_name', userData.displayName || user.displayName || 'User');
                                localStorage.setItem('quickfix_user_phone', userData.phoneNumber || '');
                                localStorage.setItem('quickfix_mode', 'user');
                                window.location.href = 'user-homepage.html';
                            }
                        } catch (err) {
                            console.log("Firestore fetch skipped", err);
                        }
                    }
                });
            }
        }

        // ==========================================
        // INPUT VALIDATIONS
        // ==========================================
        userPhoneInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10);
        });
        
        userNameInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, '').slice(0, 50);
        });

        // ==========================================
        // ENTER KEY HANDLERS
        // ==========================================
        userNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        
        userPhoneInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        loginBtn.onclick = handleLogin;
        guestBtn.onclick = guestLogin;

        // ==========================================
        // RUN SESSION CHECK
        // ==========================================
        checkExistingSession();

        // ==========================================
        // CREATE PARTICLES
        // ==========================================
        function createParticles() {
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.className = 'bg-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 6 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = 12 + Math.random() * 10 + 's';
                particle.style.background = `rgba(255, ${100 + Math.random() * 155}, 50, ${0.2 + Math.random() * 0.4})`;
                document.body.appendChild(particle);
            }
        }
        createParticles();

        console.log('%c⚡ QuickFix Login — Fully Functional with Firebase', 'color: #ffcc00; font-size: 13px; font-weight: bold;');
        console.log('%c🔥 Firebase Auth + Firestore configured!', 'color: #00ffcc; font-size: 12px;');
        console.log('%c📌 Config: quickfix-907c0', 'color: #8895a4; font-size: 11px;');
    </script>
</body>
</html>
